services:
  app:
    image: ghcr.io/redwinda/app:latest
    container_name: latex-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./latex-app-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
