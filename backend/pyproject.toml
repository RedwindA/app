[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-app-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pypdf>=5.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "aiosqlite>=0.20",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-anyio>=0.0.0",
    "anyio>=4.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
markers = [
    "requires_latex: needs latexmk + texlive in PATH",
]
